external:                       # accepts {file, title, url, icon, sidebaricon}
  - {title: Mail, icon: envelope, url: "mailto:isujeremiah@ou.edu"}
  - {title: Github, icon: github, url: "https://isujeremiah.github.io"}
  - {title: Linkedin, icon: linkedin, url: "https://linkedin.com"}


